---
layout: default
---

<div class="container max-w-xl mx-auto px-4 pt-8">
  <p class="text-3xl font-extrabold"><a href="/">{{ site.title }}</a></p>
</div>

<article class="container max-w-xl mx-auto px-4 pt-4 pb-8" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="text-3xl sm:text-5xl lg:text-6xl leading-none font-extrabold tracking-tight mb-8">{{ page.title }}</h1>
    <p class="text-gray-500 dark:text-white dark:text-opacity-60 my-5"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%b %-d, %Y" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
  </header>

  <div class="prose lg:prose-lg dark:prose-invert dark:text-gray-300" itemprop="articleBody">
    {{ content }}
  </div>

</article>
